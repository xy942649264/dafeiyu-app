workflows:
  ios-unsigned:
    name: 大肥鱼 iOS 未签名包
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.11.1
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 安装 npm 依赖
        script: |
          npm install --no-audit --no-fund
      - name: 同步前端到 iOS 工程
        script: |
          npx cap copy ios
      - name: 检查 @capacitor/ios 是否就位
        script: |
          ls -d node_modules/@capacitor/ios && cat ios/App/Podfile | head -6
      - name: pod install
        script: |
          cd ios/App && pod install
      - name: 编译未签名 ipa
        script: |
          set -e
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App.ipa Payload
          ls -la App.ipa
    artifacts:
      - ios/App/App.ipa
